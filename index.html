  <p>⌘⇧B を押すと全画面に爆発演出が流れる Mac 用ストレス解消アプリです。</p>

  <h2>使い方</h2>
  <ul>
    <li>アプリを起動するとメニューバーに常駐します。</li>
    <li><code>⌘ + ⇧ + B</code> で爆発演出を起動。</li>

    <dd>システム設定 → サウンド でミュートになっていないか確認してください。</dd>
